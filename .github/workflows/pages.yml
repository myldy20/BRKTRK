name: Deploy tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only trusted main builds deploy; fork PRs run read-only Public CI instead.
permissions:
  contents: read

concurrency:
  group: brktrk-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and prepare static tracker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify source and deterministic regressions
        run: npm test
      - name: Package verified local development synth
        run: npm run dev:engine
      - name: Build compact public web app
        run: npm run build:web
      - name: Run Chromium startup smoke against deployed output
        run: BRKTRK_WEB_DIR=dist npm run test:browser
      - name: Verify Pages payload and engine catalog
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/engines/catalog-v1.json
          test ! -e dist/.env
          printf '%s\n' 'GitHub Pages serves this payload at /BRKTRK/; relative PWA URLs stay scoped to it.'
      - name: Remove browser-only test fixture from release
        run: rm dist/public-source-browser-smoke.html
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
