name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source and runtime regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Source and deterministic regressions
        run: npm test
      - name: Build and test migrated GPL BRK Modal native DSP
        shell: bash
        run: |
          set -euo pipefail
          cmake -S engines/brk-modal -B /tmp/brktrk-modal-build -DCMAKE_BUILD_TYPE=Release -DBRK_MODAL_ENABLE_VECTOR=OFF
          cmake --build /tmp/brktrk-modal-build --target brk_modal_tests brk_modal_state_v1_tests brk_modal_parameter_descriptor_tests --parallel 2
          /tmp/brktrk-modal-build/brk_modal_tests
          /tmp/brktrk-modal-build/brk_modal_state_v1_tests
          /tmp/brktrk-modal-build/brk_modal_parameter_descriptor_tests
      - name: Build and test GPL BRK Modal ABI adapter (native)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S abi -B /tmp/brktrk-modal-abi -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/brktrk-modal-abi --parallel 2 --target brk_abi_c_test brk_abi_layout_test brk_module_runtime_test brk_native_event_executor_test brk_runtime_policy_extension_test brk_persistent_event_executor_properties_test
          /tmp/brktrk-modal-abi/brk_abi_c_test
          /tmp/brktrk-modal-abi/brk_abi_layout_test
          /tmp/brktrk-modal-abi/brk_module_runtime_test
          /tmp/brktrk-modal-abi/brk_native_event_executor_test
          /tmp/brktrk-modal-abi/brk_runtime_policy_extension_test
          /tmp/brktrk-modal-abi/brk_persistent_event_executor_properties_test
      - name: Build local developer engine
        run: npm run dev:engine
      - name: Build compact public web app
        run: npm run build:web
      - name: Chromium first-run against compact build
        run: BRKTRK_WEB_DIR=dist npm run test:browser
