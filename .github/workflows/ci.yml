name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_modal_wasm:
        description: 'Run the pinned Modal JS/WASM vs native audio qualification'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source and runtime regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Source and deterministic regressions
        run: npm test
      - name: Verify Modal qualification scope detection
        run: bash scripts/test-modal-ci-scope.sh
      - name: Verify release immutability guard
        run: node scripts/test-release-immutability.mjs
      - name: Protect published engine package identities
        if: github.event_name == 'pull_request'
        env:
          BRKTRK_IMMUTABILITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release-immutability.mjs
      - name: Build and test migrated GPL BRK Modal native DSP
        shell: bash
        run: |
          set -euo pipefail
          cmake -S engines/brk-modal -B /tmp/brktrk-modal-build -DCMAKE_BUILD_TYPE=Release -DBRK_MODAL_ENABLE_VECTOR=OFF
          cmake --build /tmp/brktrk-modal-build --target brk_modal_tests brk_modal_state_v1_tests brk_modal_parameter_descriptor_tests --parallel 2
          /tmp/brktrk-modal-build/brk_modal_tests
          /tmp/brktrk-modal-build/brk_modal_state_v1_tests
          /tmp/brktrk-modal-build/brk_modal_parameter_descriptor_tests
      - name: Build and test BRK Bogie native engine and ABI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S engines/brk-bogie -B /tmp/brktrk-bogie -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/brktrk-bogie --parallel 2
          ctest --test-dir /tmp/brktrk-bogie --output-on-failure
      - name: Build and test GPL BRK Modal ABI adapter (native)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S abi -B /tmp/brktrk-modal-abi -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/brktrk-modal-abi --parallel 2 --target brk_abi_c_test brk_abi_layout_test brk_module_runtime_test brk_native_event_executor_test brk_runtime_policy_extension_test brk_persistent_event_executor_properties_test
          /tmp/brktrk-modal-abi/brk_abi_c_test
          /tmp/brktrk-modal-abi/brk_abi_layout_test
          /tmp/brktrk-modal-abi/brk_module_runtime_test
          /tmp/brktrk-modal-abi/brk_native_event_executor_test
          /tmp/brktrk-modal-abi/brk_runtime_policy_extension_test
          /tmp/brktrk-modal-abi/brk_persistent_event_executor_properties_test
      - name: Verify standalone Modal WASM CMake configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-modal-wasm.sh
          # Configure-only: runner has no Emscripten SDK. This rejects a
          # hidden dependency on the private host's Worklet generator.
          cmake -S abi -B /tmp/brktrk-modal-wasm-config -DEMSCRIPTEN=ON -DBRK_MODAL_BUILD_LEGACY_WORKLET=OFF
      - name: Generate and validate all 34 GPL Modal factory presets
        shell: bash
        run: bash scripts/build-modal-factory-presets.sh
      - name: Build local developer engine
        run: npm run dev:engine
      - name: Install locked public engine packages
        run: node scripts/install-release-engine-store.mjs
      - name: Build compact public web app
        run: npm run build:web
      - name: Chromium first-run against compact build
        run: BRKTRK_WEB_DIR=dist npm run test:browser
      - name: Exercise locked Modal in compact public build
        run: node scripts/qualify-modal-project-journey.mjs --locked-dist
      - name: Exercise locked Bogie in compact public build
        run: node scripts/qualify-modal-project-journey.mjs --locked-bogie-dist

  modal_wasm:
    # Decide from changed files, never from the editable PR title. Even host
    # changes can break Modal, so only documentation-only PRs may skip it.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.qualify_modal_wasm)
    name: Pinned Emscripten build + native/WASM audio parity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact BRKTRK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether Modal qualification is needed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/modal-ci-scope.sh
      - name: Node.js 22
        if: steps.scope.outputs.qualify == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Emscripten SDK
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet --detach c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56 # emsdk 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Compile GPL Modal JS/WASM from this source tree
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          emcc --version | head -n 1
          npm run build:modal-wasm
      - name: Compare WASM rendered audio to native golden samples
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qualify-modal-wasm.sh
      - name: Qualify the real Chrome AudioWorklet environment
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-audioworklet.mjs
      - name: Build and verify Bogie WASM candidate
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          emcmake cmake -S engines/brk-bogie -B build/brk-bogie-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/brk-bogie-wasm --parallel 2 --target brk_bogie_wasm
          python3 scripts/build-bogie-candidate-package.py --wasm-dir build/brk-bogie-wasm \
            --output-dir build/brk-bogie-candidate/output --head-sha "$(git rev-parse HEAD)"
          node scripts/test-bogie-candidate-package.cjs
      - name: Qualify Bogie in real tracker on desktop and mobile
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-project-journey.mjs --bogie
      - name: Build or restage immutable Bogie release candidate
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if python3 -c "import json,sys; sys.exit(not any(r['entry']['engineId']=='brk-bogie' for r in json.load(open('release/engines/catalog-lock.json'))['releases']))"; then
            node scripts/stage-locked-bogie-release.mjs
          else
            git diff --quiet "$SOURCE_SHA" HEAD --
            python3 scripts/build-bogie-candidate-package.py --release --wasm-dir build/brk-bogie-wasm \
              --output-dir build/brk-bogie-release/output --head-sha "$SOURCE_SHA"
          fi
          node scripts/test-bogie-candidate-package.cjs build/brk-bogie-release/output
      - name: Qualify exact Bogie release candidate in browser
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-project-journey.mjs --bogie build/brk-bogie-release/output
      - name: Retain Bogie qualification candidate
        if: steps.scope.outputs.qualify == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-bogie-candidate
          path: build/brk-bogie-candidate/output/
          if-no-files-found: error
          retention-days: 7
      - name: Retain qualified Bogie release archive
        if: steps.scope.outputs.qualify == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-bogie-release
          path: build/brk-bogie-release/output/
          if-no-files-found: error
          retention-days: 7
      - name: Build unpublished SHA-pinned Modal package and verify real production loader
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        run: bash scripts/build-modal-candidate-package.sh
      - name: Qualify verified Modal in production Chromium AudioWorklet
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-production-worklet.mjs
      - name: Qualify Modal project playback and reopen on desktop and mobile
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-project-journey.mjs
      - name: Build versioned Modal release candidate
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if test -f release/engines/catalog-lock.json; then
            # An existing version is always re-tested from its exact locked bytes.
            node scripts/stage-locked-modal-release.mjs
          else
            # Pin the actual source commit, not the temporary PR merge ref.
            git diff --quiet "$SOURCE_SHA" HEAD --
            python3 scripts/build-modal-candidate-package.py --release --repo . \
              --wasm-dir build/brk-modal-wasm --presets build/brk-modal-factory/presets \
              --descriptor-fixture build/brk-modal-candidate/parameters.bin \
              --output-dir build/brk-modal-release/output --head-sha "$SOURCE_SHA"
          fi
          node scripts/test-modal-candidate-package.cjs build/brk-modal-release/output
      - name: Qualify release candidate in real production Worklet
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-production-worklet.mjs build/brk-modal-release/output
      - name: Qualify release candidate project journey
        if: steps.scope.outputs.qualify == 'true'
        run: node scripts/qualify-modal-project-journey.mjs build/brk-modal-release/output
      - name: Retain qualified Modal release candidate
        if: steps.scope.outputs.qualify == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-modal-release
          path: build/brk-modal-release/output/
          if-no-files-found: error
          retention-days: 7
      - name: Verify no public catalog or package was modified
        if: steps.scope.outputs.qualify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -d web/engines
          test -s build/brk-modal-wasm/brk_modal_module.js
          test -s build/brk-modal-wasm/brk_modal_module.wasm
          git diff --exit-code
          echo 'Private Modal qualification complete. No public engine package published.'
