<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BRKTRK A5.4 stale PWA bootstrap</title></head>
<body>
  <strong id="result">BRKTRK_BROWSER_TESTS_PENDING</strong>
  <script>
    const result = document.querySelector("#result");
    const STALE_MARKER = "brktrk-a5-stale-seeded-v1";
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };

    async function controllerInfo(controller) {
      if (!controller) return null;
      return new Promise((resolve) => {
        const channel = new MessageChannel();
        const timeout = setTimeout(() => resolve(null), 1500);
        channel.port1.onmessage = (event) => {
          clearTimeout(timeout);
          resolve(event.data ?? null);
        };
        controller.postMessage({ type: "brktrk-release-info-request" }, [channel.port2]);
      });
    }

    (async () => {
      try {
        assert("serviceWorker" in navigator, "Service Worker support is required for A5.4");
        // The dedicated fixture server initially exposes the stale 0.8.54 bytes
        // at the real production script URL. The CDP runner swaps that served
        // file to current production bytes only after STALE_READY, so the test
        // exercises a real same-URL Service Worker update rather than replacing
        // one synthetic script URL with another.
        await navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" });
        const deadline = Date.now() + 15000;
        let info = null;
        while (Date.now() < deadline) {
          info = await controllerInfo(navigator.serviceWorker.controller);
          if (info?.release === "0.8.54" && info?.cache === "brktrk-web-v0.8.54") break;
          await wait(50);
        }
        assert(info?.release === "0.8.54", `stale bootstrap must own release 0.8.54, got ${JSON.stringify(info)}`);
        assert(info?.cache === "brktrk-web-v0.8.54", `stale bootstrap must own the old cache, got ${JSON.stringify(info)}`);
        assert((await caches.keys()).includes("brktrk-web-v0.8.54"), "stale release cache must exist before current-worker upgrade");
        localStorage.setItem(STALE_MARKER, "0.8.54");
        result.textContent = "BRKTRK_BROWSER_TESTS_STAGE: STALE_READY";
      } catch (error) {
        console.error(error);
        result.textContent = `BRKTRK_BROWSER_TESTS_FAILED: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
