<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BRKTRK debug snapshot regression</title></head>
<body><strong id="result">BRKTRK_BROWSER_TESTS_PENDING</strong>
<script>
const result=document.querySelector('#result');
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const KEY='brktrk-web-v2-alpha-1';
function assert(value,message){if(!value)throw new Error(message)}
function clearStorage(){for(let i=localStorage.length-1;i>=0;i-=1){const key=localStorage.key(i);if(key?.startsWith('brktrk'))localStorage.removeItem(key)}}
async function waitPersisted(schemaVersion){for(let i=0;i<160;i+=1){try{const raw=localStorage.getItem(KEY);if(raw&&JSON.parse(raw)?.schemaVersion===schemaVersion)return}catch{}await wait(20)}throw new Error(`Canonical project schema v${schemaVersion} did not persist before diagnostics snapshot`)}
(async()=>{try{
 clearStorage();
 const expected=(await (await fetch('./version.json',{cache:'no-store'})).json()).version;
 const frame=document.createElement('iframe');frame.width='390';frame.height='844';frame.src='./index.html';document.body.append(frame);
 await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
 const w=frame.contentWindow;const d=frame.contentDocument;
 for(let i=0;i<500;i+=1){if(w.BRKTRKDiagnostics&&w.BRKTRKCommands?.installed&&w.BRKTRKBootstrapInput?.commandArchitectureReady()&&!w.BRKTRKBootstrapInput?.isBlocked()&&w.navigator.serviceWorker?.controller)break;await wait(20)}
 assert(w.BRKTRKDiagnostics,'Diagnostics API must load with command architecture');
 const expectedSchema=w.BRKTRKProjectStorage?.CURRENT_SCHEMA_VERSION;
 assert(Number.isInteger(expectedSchema)&&expectedSchema>=3,'Diagnostics fixture must resolve the canonical Project schema owner instead of hardcoding an old schema version');
 assert(w.BRKTRKK3CTransportAdapter?.version===1,'Full app bootstrap must install K3C against the production lexical audio facade');
 assert(w.BRKTRKK3CTransportAdapter?.release===expected,'K3C runtime bytes must identify the same Web release as version.json');
 assert(d.body.dataset.timelineArchitecture==='k3c','Full app must expose K3C production timeline ownership');
 assert(d.body.dataset.k3cRelease===expected,'K3C body marker must expose its actual release');
 assert(d.querySelector('#debugExportButton')?.textContent.trim()==='EXPORT DEBUG JSON','Settings must expose EXPORT DEBUG JSON');
 assert(d.querySelector('#debugExportNotice')?.textContent.includes('full project'),'Settings must explain debug snapshot scope');

 d.querySelector('#bootButton').click();
 for(let i=0;i<300;i+=1){if(w.BRKTRKStores?.transport?.runtime?.snapshot?.()?.worklet?.ready)break;await wait(20)}
 assert(w.BRKTRKStores?.transport?.runtime?.snapshot?.()?.worklet?.ready===true,'Real AudioWorklet must be ready before runtime diagnostics');

 await w.BRKTRKCommands.dispatch({type:'cursor.select',pane:'phrase',row:0,col:3,focus:false,source:'debug-fixture'});
 await w.BRKTRKCommands.dispatch({type:'field.setExact',value:4,source:'debug-fixture'});
 await w.BRKTRKCommands.dispatch({type:'cursor.select',pane:'phrase',row:0,col:4,focus:false,source:'debug-fixture-visible-fallback'});
 assert(w.eval('state.focus.pane === "phrase" && state.focus.row === 0 && state.focus.col === 3'),'Debug fixture hidden VAL1 selection must normalize to visible FX1 NavigationStore cursor');
 await w.BRKTRKCommands.dispatch({type:'field.setExact',cursor:{pane:'phrase',row:0,col:4},value:2,source:'debug-fixture-explicit-hidden-value'});
 assert(w.eval('state.focus.pane === "phrase" && state.focus.row === 0 && state.focus.col === 3'),'Explicit debug hidden-value edit must not move or create a second semantic cursor');
 await waitPersisted(expectedSchema);
 const unregister=w.BRKTRKDiagnostics.registerSection('fixture-extension',()=>({ok:true,marker:'diagnostics-extensible'}));
 const snapshot=await w.BRKTRKDiagnostics.buildSnapshot();
 assert(snapshot.format==='BRKTRK-DEBUG-SNAPSHOT'&&snapshot.snapshotVersion===1,'Debug envelope must be versioned');
 assert(snapshot.project?.canonicalModel?.schemaVersion===expectedSchema,'Debug snapshot must contain the full canonical project at the current schema');
 assert(snapshot.project?.canonicalModel?.phrases?.[0]?.[0]?.fx?.[0]?.command===4&&snapshot.project?.canonicalModel?.phrases?.[0]?.[0]?.fx?.[0]?.value===2,'Debug project must include current compound FX data');
 assert(snapshot.session?.stores?.project?.schemaVersion===expectedSchema,'Debug snapshot must include current-schema ProjectStore state');
 assert(snapshot.session?.stores?.navigation&&snapshot.session?.stores?.transport,'Debug snapshot must include NavigationStore and TransportStore state');
 assert(snapshot.transport?.runtimeSnapshot,'Debug snapshot must include transport runtime ownership state');
 assert(snapshot.fx?.registry?.map(entry=>entry.code).join(',')==='0,1,4,5','Debug snapshot must carry the active FX registry');
 assert(snapshot.audio?.audioContext?.state==='running'&&snapshot.audio?.audioContext?.sampleRate>0,'Debug snapshot must inspect the real BrowserAudio.context instead of a nonexistent ctx alias');
 assert(snapshot.audio?.workletRuntime?.available===true,'Debug snapshot must complete a read-only AudioWorklet runtime handshake');
 assert(snapshot.audio?.workletRuntime?.value?.workletRelease===expected,'AudioWorklet entry bytes must identify the current Web release');
 assert(snapshot.audio?.workletRuntime?.value?.diagnosticsRelease===expected,'AudioWorklet diagnostics module must identify the current Web release');
 assert(snapshot.audio?.workletRuntime?.value?.loaded?.phraseFxRuntime===true,'AudioWorklet handshake must prove the Phrase FX runtime domain is loaded');
 assert(snapshot.audio?.workletRuntime?.value?.loaded?.eventTrace===true,'AudioWorklet handshake must prove the K4 event trace is loaded');
 assert(snapshot.audio?.workletRuntime?.value?.loaded?.realtimeWindow===true,'AudioWorklet handshake must prove the K4B realtime window is loaded');
 assert(snapshot.fx?.runtimeVersion===1&&snapshot.fx?.traceVersion===2&&snapshot.fx?.runtimeProtocol===3,'Top-level FX diagnostics must come from Worklet evidence rather than false Window-global probes');
 assert(snapshot.modules?.BRKTRKPhraseFxRuntimeDomain?.scope==='shared'&&snapshot.modules?.BRKTRKPhraseFxRuntimeDomain?.loaded===true,'Window module inventory must report Phrase FX runtime as shared after R2 control-plane preparation');
 assert(snapshot.modules?.BRKTRKEventTraceDomain?.scope==='shared'&&snapshot.modules?.BRKTRKEventTraceDomain?.loaded===true,'Window module inventory must report event trace as shared after R2 control-plane preparation');
 assert(snapshot.modules?.BRKTRKRealtimeEventWindowDomain?.scope==='audio-worklet'&&snapshot.modules?.BRKTRKRealtimeEventWindowDomain?.loaded===false,'Window module inventory must keep the realtime event window Worklet-only instead of treating its Window absence as failure');
 assert(snapshot.build?.serviceWorkerRuntime?.available===true&&snapshot.build?.serviceWorkerRuntime?.value?.release===expected,'Debug snapshot must obtain the active Service Worker release identity');
 assert(snapshot.build?.k3cRelease===expected,'Debug snapshot must expose K3C release identity');
 assert(snapshot.build?.releaseConsistency?.mismatches?.length===0,'Debug snapshot must detect no mixed-release runtime planes in the full app fixture: '+JSON.stringify(snapshot.build?.releaseConsistency));
 assert(snapshot.build?.releaseConsistency?.observed?.visibleCss===expected,'Visible CSS release marker must agree with version.json');
 assert(snapshot.environment?.viewport?.width===390,'Debug snapshot must include device/viewport context');
 assert(snapshot.persistence?.localStorage?.[KEY]?.parsed?.schemaVersion===expectedSchema,'Debug snapshot must include the persisted canonical local project at the current schema');
 assert(snapshot.history?.commands?.length>=2,'Debug snapshot must retain recent semantic command history');
 assert(!snapshot.history?.errors?.some(entry=>String(entry?.value?.message||'').includes('K3C Transport adapter requires the existing audio facade')),'Production debug history must not contain the rejected 0.8.28 K3C audio-facade bootstrap error');
 assert(snapshot.registeredSections.includes('fixture-extension')&&snapshot.custom?.['fixture-extension']?.marker==='diagnostics-extensible','Feature diagnostics registry must be extensible');
 assert(JSON.stringify(snapshot).length>1000,'Debug snapshot must serialize as a substantial JSON diagnostic payload');

 w.__debugDownload=null;
 w.HTMLAnchorElement.prototype.click=function(){w.__debugDownload={name:this.download,href:this.href};};
 d.querySelector('#debugExportButton').click();
 for(let i=0;i<100&&!w.__debugDownload;i+=1)await wait(20);
 assert(w.__debugDownload?.name?.endsWith('.brktrk-debug.json'),'Settings action must generate a .brktrk-debug.json filename');
 assert(w.__debugDownload?.href?.startsWith('blob:'),'Settings action must generate a local JSON Blob download rather than upload diagnostics');
 unregister();
 frame.remove();clearStorage();
 result.textContent='BRKTRK_BROWSER_TESTS_PASSED';
}catch(error){console.error(error);result.textContent='BRKTRK_BROWSER_TESTS_FAILED: '+error.message}})();
</script></body></html>
