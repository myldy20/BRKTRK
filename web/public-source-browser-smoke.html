<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BRKTRK clean public clone browser smoke</title></head>
<body>
<strong id="result">BRKTRK_BROWSER_TESTS_PENDING</strong>
<iframe id="app" src="./index.html" width="1210" height="828" title="BRKTRK public browser smoke" style="position:absolute;top:32px;left:0;border:0"></iframe>
<script>
(() => {
  const result = document.querySelector("#result");
  const frame = document.querySelector("#app");
  const width = Number(new URL(location.href).searchParams.get("width") || 1210);
  if (!Number.isInteger(width) || ![1210, 390].includes(width)) {
    result.textContent = "BRKTRK_BROWSER_TESTS_FAILED: invalid viewport";
    return;
  }
  frame.width = width;
  frame.height = width < 600 ? 844 : 828;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const stage = (name) => { result.textContent = "BRKTRK_BROWSER_TESTS_STAGE: " + name; };
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  frame.addEventListener("load", () => {
    void (async () => {
      const app = frame.contentWindow;
      const doc = frame.contentDocument;
      stage("APP_BOOTSTRAP_" + width);
      let ready = false;
      for (let attempt = 0; attempt < 500; attempt += 1) {
        ready = doc?.body?.dataset?.bootstrapInput === "ready"
          && doc?.querySelector("#appShell")?.inert === false
          && typeof app?.BRKTRKStores?.project?.getState === "function"
          && typeof app?.BRKTRKProductionEngineHost?.ensurePackageView === "function";
        if (ready) break;
        await wait(50);
      }
      assert(ready, "real app did not reach editable boot state · viewport=" + width
        + " / bootstrap=" + (doc?.body?.dataset?.bootstrapInput ?? "unknown")
        + " / status=" + (doc?.querySelector("#statusLine")?.textContent ?? "none")
        + " / runtime=" + JSON.stringify(app?.BRKTRKDynamicRuntimeStartup?.snapshot?.() ?? null)
        + " / error=" + (doc?.body?.dataset?.dynamicRuntimeError ?? "none")
        + " / reason=" + (doc?.body?.dataset?.bootstrapInputReason ?? "none")
        + " / failure=" + String(app?.BRKTRKBootstrapInput?.snapshot?.().startupFailure ?? "none").slice(0, 250)
        + " / surface=" + (doc?.body?.dataset?.bootstrapSurface ?? "none")
        + " / commandReady=" + String(app?.BRKTRKBootstrapInput?.snapshot?.().commandArchitectureReady)
        + " / mixerReady=" + String(Boolean(app?.BRKTRKTrackMixer?.installed))
        + " / soundReady=" + String(Boolean(app?.BRKTRKSoundEditRenderer?.renderProductionSurface)));
      const shell = doc.querySelector("#appShell");
      assert(app.getComputedStyle(shell).visibility === "visible", "app shell not visible");
      assert(doc.querySelector("#playButton")?.isConnected, "transport missing");
      assert(doc.querySelector("#tempoUp")?.isConnected, "tempo controls missing");
      assert(app.BRKTRKStores.project.getState().projectName !== undefined, "ProjectStore unavailable");
      assert(app.innerWidth === width, "iframe viewport failed to apply expected width");

      stage("CATALOG_" + width);
      const host = app.BRKTRKProductionEngineHost;
      const entries = await host.refreshCatalog();
      const entry = entries.find((item) =>
        item.moduleId === "design.myldy.dev"
        && item.engineId === "brk-dev-poly"
        && item.channel === "stable");
      assert(entry, "genuine local development synth missing from trusted catalog");

      stage("HASH_VERIFIED_PACKAGE_" + width);
      const view = await host.ensurePackageView({
        moduleId: entry.moduleId,
        engineId: entry.engineId,
        requestedVersion: entry.version,
      });
      assert(view?.entry?.packageSha256 === entry.packageSha256,
        "local synth package identity/hash not verified");
      assert(view.parameters?.length === 9,
        "genuine development synth parameter registry must expose nine parameters");

      // This caught the compact build regression where twelve shared Worklet
      // imports were deleted from dist/ while the app shell still booted.
      // Headless Chromium is launched with no-user-gesture autoplay for CI.
      stage("AUDIO_WORKLET_" + width);
      const audioReadiness = app.BRKTRKAudioReadiness;
      assert(typeof audioReadiness?.ensureReady === "function", "AudioReadiness unavailable");
      await Promise.race([
        audioReadiness.ensureReady({ source: "public-source-browser-smoke" }),
        wait(12000).then(() => { throw new Error("AudioWorklet readiness timeout"); }),
      ]);
      assert(audioReadiness.snapshot().ready === true,
        "AudioWorklet did not reach running and verified audio readiness");
      assert(!doc.body.dataset.bootstrapInput || doc.body.dataset.bootstrapInput === "ready",
        "input was unexpectedly re-locked");

      // ALPHA USER JOURNEY: exercise the shipped UI, production project stores,
      // transport, portable Save As and Open. These are the actual dist assets.
      // A fresh Chrome profile has no songs, Instruments or test-only shortcuts.
      stage("ALPHA_FIRST_INSTRUMENT_" + width);
      const project = app.BRKTRKStores.project;
      const session = app.BRKTRKProjectFileSession;
      assert(session?.installed && typeof session.dispatch === "function", "portable project file session missing");
      assert(Object.keys(project.getState().instrumentPool ?? {}).length === 0,
        "clean first-run profile must start with no fake Instruments");
      const instToggle = doc.querySelector('[data-panel="sound"]');
      assert(instToggle, "Instrument panel shortcut missing");
      instToggle.click();
      assert(app.BRKTRKSoundEditRenderer?.renderProductionSurface?.(), "Sound panel did not render");
      let create = null;
      for (let attempt = 0; attempt < 120; attempt += 1) {
        create = doc.querySelector("#instrumentInspector .a4a-create-panel button");
        if (create && !create.disabled && create.textContent === "CREATE") break;
        await wait(50);
      }
      assert(create && !create.disabled && create.textContent === "CREATE",
        "a verified synth must offer a usable CREATE action");
      create.click();
      for (let attempt = 0; attempt < 160 && !project.getState().instrumentPool?.[0]; attempt += 1) {
        await wait(50);
      }
      const instrument = project.getState().instrumentPool?.[0];
      assert(instrument?.engineRef?.resolvedPackageSha256 === entry.packageSha256,
        "CREATE must assign the exact verified synth package");
      const phrase = project.getState().phrases?.[0];
      assert(phrase?.[0]?.instrument === 0 && phrase?.[8]?.instrument === 0,
        "the untouched first-run preview should be assigned to the newly created Instrument");
      assert(project.getState().song?.[0]?.[0] === 0,
        "a ready Instrument must not break the Song -> Chain -> Phrase references");

      stage("ALPHA_EDIT_PLAY_STOP_" + width);
      assert(project.phraseSteps?.replaceStep && project.setTempo,
        "canonical Phrase/Tempo edit commands missing");
      const editedStep = { ...project.phraseSteps.read(0, 2), note: 60, velocity: 94, instrument: 0 };
      const edit = project.phraseSteps.replaceStep(0, 2, editedStep, { source: "alpha-browser-user-journey" });
      assert(edit.mutated && project.getState().phrases[0][2].note === 60,
        "new Phrase step was not committed");
      project.setTempo(137, { source: "alpha-browser-user-journey" });
      assert(session.snapshot().dirty === true, "project editing should be marked unsaved");
      doc.querySelector("#playButton").click();
      let playing = false;
      for (let attempt = 0; attempt < 100; attempt += 1) {
        playing = app.BRKTRKStores.transport.runtime.isPlaying();
        if (playing) break;
        await wait(50);
      }
      assert(playing, "the edited Phrase with a verified Instrument did not start playing: "
        + (doc.querySelector("#statusLine")?.textContent ?? "no status"));
      app.stopPlayback();
      for (let attempt = 0; attempt < 100 && app.BRKTRKStores.transport.runtime.isPlaying(); attempt += 1) {
        await wait(50);
      }
      assert(!app.BRKTRKStores.transport.runtime.isPlaying(), "Stop did not clear playing state");

      stage("ALPHA_SAVE_AS_" + width);
      const expectedProject = JSON.stringify(app.BRKTRKProjectFileSessionDomain.canonicalProject(project.getState()));
      const capabilities = session.snapshot().capabilities;
      let fileOnDisk = null;
      const memoryHandle = {
        name: "brktrk-alpha-journey.brktrk",
        async getFile() {
          return { name: this.name, size: new TextEncoder().encode(fileOnDisk ?? "").byteLength,
            lastModified: 100, async text() { return fileOnDisk; } };
        },
        async createWritable() {
          let pending = "";
          return { async write(text) { pending = String(text); },
            async close() { fileOnDisk = pending; } };
        },
      };
      if (capabilities.directSave) {
        app.showSaveFilePicker = async () => memoryHandle;
      } else {
        // The fallback returns the exact portable bytes but cannot confirm
        // a disk write. Prevent an actual download from the CI fixture.
        app.HTMLAnchorElement.prototype.click = function () {};
      }
      const saved = await session.dispatch({ type: "project.saveAs", source: "alpha-browser-user-journey" });
      assert(saved.ok && typeof saved.text === "string", "portable Save As failed");
      assert(saved.durableWriteConfirmed === Boolean(capabilities.directSave),
        "download fallback must never claim that a durable file write was confirmed");
      const portable = saved.text;
      assert(app.BRKTRKProjectFile.parseEnvelope(portable).format === "BRKTRK_PROJECT",
        "Save As did not write a supported .brktrk envelope");
      assert(JSON.stringify(app.BRKTRKProjectFile.prepareOpen(portable).project) === expectedProject,
        "portable file differs from the edited canonical project");
      if (capabilities.directSave) {
        assert(fileOnDisk === portable && session.snapshot().dirty === false,
          "successful File System Access Save As must establish a clean on-disk baseline");
      }

      stage("ALPHA_NEW_AND_REOPEN_" + width);
      const fresh = await session.dispatch({ type: "project.new", force: true, source: "alpha-browser-user-journey" });
      assert(fresh.ok, "NEW failed after saving a project");
      assert(Object.keys(project.getState().instrumentPool ?? {}).length === 0,
        "NEW must remove the previous project's instruments from active state");
      const opened = await session.dispatch({
        type: "project.open",
        force: true,
        source: "alpha-browser-user-journey",
        file: { ok: true, text: portable, fileName: memoryHandle.name,
          mode: capabilities.directSave ? "handle" : "upload",
          handle: capabilities.directSave ? memoryHandle : null },
      });
      assert(opened.ok, "OPEN rejected the recently saved .brktrk file: "
        + String(opened.error?.message ?? "unknown"));
      assert(JSON.stringify(app.BRKTRKProjectFileSessionDomain.canonicalProject(project.getState())) === expectedProject,
        "OPEN lost Song, Phrase, instrument, preset, tempo or project metadata");
      assert(session.snapshot().dirty === false && project.getState().tempo === 137,
        "reopened file must start clean with the saved tempo");
      assert(project.getState().instrumentPool[0].engineRef.resolvedPackageSha256 === entry.packageSha256,
        "reopened synth must retain the hash-pinned engine identity");

      stage("ALPHA_EDIT_AFTER_OPEN_" + width);
      project.setTempo(141, { source: "alpha-browser-user-journey-after-open" });
      assert(session.snapshot().dirty === true, "editing after reopening must mark the project unsaved");
      if (capabilities.directSave) {
        const again = await session.dispatch({ type: "project.save", source: "alpha-browser-user-journey-after-open" });
        assert(again.ok && again.durableWriteConfirmed,
          "direct SAVE after reopening a file handle must write to the bound file");
        assert(app.BRKTRKProjectFile.prepareOpen(fileOnDisk).project.tempo === 141,
          "direct SAVE must include changes made after OPEN");
        assert(session.snapshot().dirty === false, "successful direct SAVE must restore clean state");
      }
      assert(doc.body.dataset.bootstrapInput === "ready" && !doc.querySelector("#appShell").inert,
        "save/open flow unexpectedly blocked tracker input");

      result.dataset.diagnostics = JSON.stringify({
        viewport: width, engine: entry.moduleId + "/" + entry.engineId,
        version: entry.version, parameters: view.parameters.length, schema: "public-v1",
      });
      result.textContent = "BRKTRK_BROWSER_TESTS_PASSED";
    })().catch((error) => {
      result.textContent = "BRKTRK_BROWSER_TESTS_FAILED: "
        + String(error?.message ?? error).slice(0, 600);
    });
  }, { once: true });
})();
</script>
</body>
</html>
