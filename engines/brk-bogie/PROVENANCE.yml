implementation_notes:
  - Standalone donor core is preferred over ChooChooTracker chipnomad_lib because it has no tracker Project/playback/UI/MIDI dependency.
  - BRK-owned BogieEngine adds a fixed eight-voice performer boundary, note identity, bounded voice stealing, velocity/level mapping and the BRK Synth ABI v1 seam.
  - Generic BRK Instrument/host layers own modulation/presentation rather than importing Choo tracker voice-post state.
  - No allocation, blocking or I/O occurs in the process path.
  - Migrated from BRKSNTH_private main 70d7244895591d1db6c25afaead7009353a0e4bb into GPL-3.0-only BRKTRK on 2026-11-05. Upstream donor remains MIT.
  - The upstream standalone test changes only its include path to match the vendored layout.
  - P1 freezes eight public parameters, canonical 120-byte state v1, generic ABI v1, fixed-memory WASM targets and descriptor-driven all-parameter UI metadata.
